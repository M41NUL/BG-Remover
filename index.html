<script>
(function () {
  var theme = null;
  try { theme = localStorage.getItem("bgr-theme"); } catch (e) {}
  if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
})();
</script>

class ApiError extends Error {
  constructor(info) {
    super("api");
    this.info = info;
  }
}

function store(key, value) {
  try { localStorage.setItem(key, value); } catch {}
}

function t(key, vars) {
  let text = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if (vars) for (const name in vars) text = text.replace("{" + name + "}", vars[name]);
  return text;
}

function renderError() {
  errorBox.innerHTML = "";
  if (!lastError) {
    errorBox.hidden = true;
    return;
  }
  errorBox.innerHTML = '<svg class="ic"><use href="#i-alert"/></svg>';
  const span = document.createElement("span");
  span.textContent = lastError.text || t(lastError.key, lastError.vars);
  errorBox.appendChild(span);
  errorBox.hidden = false;
}

function showError(info) {
  lastError = info;
  renderError();
}

function clearError() {
  lastError = null;
  renderError();
}

function errorText(info) {
  return info ? info.text || t(info.key, info.vars) : "";
}

function applyI18n() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-label]").forEach((el) => {
    el.setAttribute("aria-label", t(el.dataset.i18nLabel));
  });
  $("lang").textContent = lang === "en" ? "বাংলা" : "English";
  $("lang").setAttribute("lang", lang === "en" ? "bn" : "en");
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme").setAttribute("aria-label", dark ? t("light") : t("dark"));
  const presetValue = presetSel.value || preset;
  presetSel.innerHTML = "";
  for (const key in PRESETS) presetSel.add(new Option(t(PRESETS[key].key), key));
  presetSel.value = presetValue;
  if (!formatSel.options.length) for (const key in FORMATS) formatSel.add(new Option(FORMATS[key], key));
  formatSel.value = format;
  renderDD(presetSel);
  renderDD(formatSel);
  renderError();
  renderThumbs();
  const it = current();
  if (it) $("failMsg").textContent = errorText(it.err);
}

function renderDD(sel) {
  const root = sel.closest(".dd");
  const menu = root.querySelector(".dd-menu");
  const chosen = sel.options[sel.selectedIndex];
  root.querySelector(".dd-btn > span").textContent = chosen ? chosen.text : "";
  menu.innerHTML = "";
  Array.from(sel.options).forEach((opt) => {
    const item = document.createElement("button");
    item.type = "button";
    item.className = "dd-opt";
    item.setAttribute("role", "option");
    item.setAttribute("aria-selected", String(opt.value === sel.value));
    item.innerHTML = '<span></span><svg class="ic"><use href="#i-check"/></svg>';
    item.firstChild.textContent = opt.text;
    item.addEventListener("click", () => {
      sel.value = opt.value;
      sel.dispatchEvent(new Event("change"));
      closeDD();
      renderDD(sel);
    });
    menu.appendChild(item);
  });
}

function closeDD() {
  document.querySelectorAll(".dd.open").forEach((dd) => {
    dd.classList.remove("open");
    dd.querySelector(".dd-btn").setAttribute("aria-expanded", "false");
  });
  $("panel").classList.remove("raised");
}

document.querySelectorAll(".dd-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    const dd = btn.closest(".dd");
    const wasOpen = dd.classList.contains("open");
    closeDD();
    if (wasOpen) return;
    dd.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    $("panel").classList.add("raised");
  });
});

function current() {
  return items.find((item) => item.id === selectedId) || null;
}

function setPos(value) {
  stage.style.setProperty("--pos", value + "%");
  slider.value = value;
}

function sweepStage(target, input, onStep) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    target.style.setProperty("--pos", "50%");
    input.value = 50;
    if (onStep) onStep(50);
    return;
  }
  const start = performance.now();
  const duration = 900;
  const step = (now) => {
    const p = Math.min((now - start) / duration, 1);
    const value = 100 - 50 * (1 - Math.pow(1 - p, 3));
    target.style.setProperty("--pos", value + "%");
    input.value = value;
    if (onStep) onStep(value);
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function loadImage(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function updateRatio() {
  const it = current();
  const p = PRESETS[preset];
  const ratio = p.w ? p.w / p.h : it && it.ratio ? it.ratio : 1.5;
  stage.style.setProperty("--ratio", ratio);
  stage.classList.toggle("padded", Boolean(p.w));
}

function applyBackground() {
  if (bg === "transparent") {
    resultLayer.classList.add("checker");
    resultLayer.style.backgroundColor = "";
  } else {
    resultLayer.classList.remove("checker");
    resultLayer.style.backgroundColor = bg === "white" ? "#ffffff" : colorInput.value;
  }
  swatches.forEach((button) => {
    const on = button.dataset.bg === bg;
    button.classList.toggle("on", on);
    button.setAttribute("aria-pressed", String(on));
  });
  customSwatch.classList.toggle("on", bg === "color");
  document.querySelector(".seg").style.setProperty("--i", bg === "transparent" ? 0 : bg === "white" ? 1 : 2);
  updateNote();
}

function updateNote() {
  $("jpgNote").hidden = !(format === "jpeg" && bg === "transparent");
}

function updateActions() {
  const doneCount = items.filter((item) => item.status === "done").length;
  $("downloadAll").hidden = doneCount < 2;
}

function itemLabel(item) {
  const index = items.indexOf(item) + 1;
  const states = { done: "stDone", processing: "stProcessing", pending: "stPending", error: "stError" };
  return t("imageN", { n: index }) + ", " + t(states[item.status]);
}

function renderThumbs() {
  thumbs.innerHTML = "";
  if (items.length < 2) return;
  items.forEach((item) => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "thumb";
    button.setAttribute("aria-label", itemLabel(item));
    button.setAttribute("aria-current", String(item.id === selectedId));
    const img = document.createElement("img");
    img.alt = "";
    img.src = item.resultURL || item.origURL;
    const dot = document.createElement("i");
    dot.className = "dot " + item.status;
    button.append(img, dot);
    button.addEventListener("click", () => select(item.id));
    thumbs.appendChild(button);
  });
}

function refreshStage() {
  const it = current();
  if (!it) return;
  if (origImg.dataset.id !== String(it.id)) {
    origImg.src = it.origURL;
    origImg.dataset.id = it.id;
  }
  if (it.resultURL) {
    if (resultImg.dataset.id !== String(it.id)) {
      resultImg.src = it.resultURL;
      resultImg.dataset.id = it.id;
    }
  } else {
    resultImg.removeAttribute("src");
    delete resultImg.dataset.id;
  }
  app.dataset.status = it.status;
  $("failMsg").textContent = errorText(it.err);
  updateRatio();
  if (it.status === "done") {
    if (!it.revealed) {
      it.revealed = true;
      sweepStage(stage, slider, (value) => { it.pos = value; });
    } else {
      setPos(it.pos == null ? 50 : it.pos);
    }
  } else {
    setPos(100);
  }
  updateActions();
}

function select(id) {
  selectedId = id;
  renderThumbs();
  refreshStage();
}

function syncUI(item) {
  renderThumbs();
  if (current() === item) refreshStage();
  updateActions();
}

async function shrink(file) {
  let bitmap;
  try {
    bitmap = await createImageBitmap(file);
  } catch {
    return null;
  }
  const longest = Math.max(bitmap.width, bitmap.height);
  for (const factor of [1, 0.85, 0.7, 0.55, 0.4, 0.3]) {
    const scale = Math.min(1, 4096 / longest) * factor;
    const canvas = document.createElement("canvas");
    canvas.width = Math.max(1, Math.round(bitmap.width * scale));
    canvas.height = Math.max(1, Math.round(bitmap.height * scale));
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.95));
    if (blob && blob.size <= MAX_BYTES) {
      return new File([blob], (file.name || "image").replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
    }
  }
  return null;
}

async function readError(res) {
  try {
    const data = await res.json();
    if (data && data.error) return { text: data.error };
  } catch {}
  return { key: "failed", vars: { status: res.status } };
}

async function processItem(item) {
  item.status = "processing";
  item.err = null;
  syncUI(item);
  const controller = new AbortController();
  item.controller = controller;
  const timer = setTimeout(() => controller.abort(), 60000);
  try {
    let upload = item.file;
    if (item.file.size > MAX_BYTES) {
      upload = await shrink(item.file);
      if (!upload) throw new ApiError({ key: "tooLarge" });
    }
    const form = new FormData();
    form.append("image", upload, upload.name || "image");
    form.append("background", "transparent");
    const res = await fetch(API_URL, { method: "POST", body: form, signal: controller.signal });
    if (!res.ok) throw new ApiError(await readError(res));
    const blob = await res.blob();
    if (!items.includes(item)) return;
    item.resultBlob = blob;
    item.resultURL = URL.createObjectURL(blob);
    item.status = "done";
  } catch (err) {
    if (!items.includes(item)) return;
    item.status = "error";
    if (err instanceof ApiError) item.err = err.info;
    else if (err && err.name === "AbortError") item.err = { key: "timeout" };
    else item.err = { key: "network" };
  } finally {
    clearTimeout(timer);
  }
  if (items.includes(item)) syncUI(item);
}

async function runQueue() {
  if (running) return;
  running = true;
  try {
    for (;;) {
      const next = items.find((item) => item.status === "pending");
      if (!next) break;
      await processItem(next);
    }
  } finally {
    running = false;
  }
}

function addFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  clearError();
  const valid = files.filter((file) => TYPES.includes(file.type));
  const skipped = files.length - valid.length;
  const room = MAX_FILES - items.length;
  const accepted = valid.slice(0, Math.max(room, 0));
  if (!valid.length) {
    showError({ key: "badType" });
    return;
  }
  if (valid.length > accepted.length) showError({ key: "tooMany", vars: { n: MAX_FILES } });
  else if (skipped) showError({ key: "skipped", vars: { n: skipped } });
  if (!accepted.length) return;

  accepted.forEach((file) => {
    const item = {
      id: nextId++,
      file,
      origURL: URL.createObjectURL(file),
      name: (file.name || "image").replace(/\.[^.]+$/, "").replace(/[^\p{L}\p{N}_-]+/gu, "-").replace(/^-+|-+$/g, "") || "image",
      status: "pending",
      err: null,
      ratio: null,
      revealed: false,
      pos: null,
      resultBlob: null,
      resultURL: null,
      controller: null
    };
    items.push(item);
    loadImage(item.origURL).then((img) => {
      item.ratio = img.naturalWidth / img.naturalHeight;
      if (current() === item) updateRatio();
    }).catch(() => {});
  });
  app.dataset.state = "work";
  const firstNew = items[items.length - accepted.length];
  if (!current()) selectedId = firstNew.id;
  renderThumbs();
  refreshStage();
  runQueue();
}

async function renderBlob(item) {
  const p = PRESETS[preset];
  if (!p.w && format === "png" && bg === "transparent" && item.resultBlob && item.resultBlob.type === "image/png") {
    return { blob: item.resultBlob, ext: "png" };
  }
  const img = await loadImage(item.resultURL);
  const w = p.w || img.naturalWidth;
  const h = p.h || img.naturalHeight;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  if (bg === "white" || (bg === "transparent" && format === "jpeg")) {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, w, h);
  } else if (bg === "color") {
    ctx.fillStyle = colorInput.value;
    ctx.fillRect(0, 0, w, h);
  }
  if (p.w) {
    const pad = 0.04;
    const scale = Math.min((w * (1 - 2 * pad)) / img.naturalWidth, (h * (1 - 2 * pad)) / img.naturalHeight);
    const dw = img.naturalWidth * scale;
    const dh = img.naturalHeight * scale;
    ctx.drawImage(img, (w - dw) / 2, (h - dh) / 2, dw, dh);
  } else {
    ctx.drawImage(img, 0, 0);
  }
  const type = "image/" + format;
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, type, 1));
  if (!blob) throw new Error("export");
  const ext = blob.type === "image/jpeg" ? "jpg" : blob.type === "image/webp" ? "webp" : "png";
  return { blob, ext };
}

function saveBlob(blob, name) {
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = name;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href), 1500);
}

function fileName(item, ext) {

  } finally {
    button.disabled = false;
    button.classList.remove("loading");
  }
}

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function makeZip(files) {
  const encoder = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  for (const file of files) {
    const name = encoder.encode(file.name);
    const crc = crc32(file.data);
    const size = file.data.length;
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);
    local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);
    local.setUint16(12, 0x21, true);
    local.setUint32(14, crc, true);
    local.setUint32(18, size, true);
    local.setUint32(22, size, true);
    local.setUint16(26, name.length, true);
    parts.push(local.buffer, name, file.data);
    const head = new DataView(new ArrayBuffer(46));
    head.setUint32(0, 0x02014b50, true);
    head.setUint16(4, 20, true);
    head.setUint16(6, 20, true);
    head.setUint16(8, 0x0800, true);
    head.setUint16(14, 0x21, true);
    head.setUint32(16, crc, true);
    head.setUint32(20, size, true);
    head.setUint32(24, size, true);
    head.setUint16(28, name.length, true);
    head.setUint32(42, offset, true);
    central.push(head.buffer, name);
    offset += 30 + name.length + size;
  }
  const centralSize = central.reduce((sum, part) => sum + part.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: "application/zip" });
}

async function downloadAll() {
  const done = items.filter((item) => item.status === "done");
  if (!done.length) return;
  const button = $("downloadAll");
  button.disabled = true;
  button.classList.add("loading");
  try {
    const files = [];
    const used = new Set();
    for (const item of done) {
      const out = await renderBlob(item);
      let name = fileName(item, out.ext);
      let n = 2;
      while (used.has(name)) name = item.name + "-" + TOOL_NAME + "-" + n++ + "." + out.ext;
      used.add(name);
      files.push({ name, data: new Uint8Array(await out.blob.arrayBuffer()) });
    }
    saveBlob(makeZip(files), TOOL_NAME + "-images.zip");
  } catch {
    showError({ key: "exportFail" });
  } finally {
    button.disabled = false;
    button.classList.remove("loading");
  }
}

function reset() {
  items.forEach((item) => {
    if (item.controller) item.controller.abort();
    URL.revokeObjectURL(item.origURL);
    if (item.resultURL) URL.revokeObjectURL(item.resultURL);
  });
  items = [];
  selectedId = null;
  delete app.dataset.status;
  delete origImg.dataset.id;
  delete resultImg.dataset.id;
  origImg.removeAttribute("src");
  resultImg.removeAttribute("src");
  thumbs.innerHTML = "";
  clearError();
  app.dataset.state = "empty";
  $("file").value = "";
  $("file2").value = "";
}

const cp = { h: 211, s: 0.96, v: 1 };
const CP_PRESETS = ["#ffffff", "#000000", "#ff3b30", "#ff9500", "#ffcc00", "#34c759", "#0a84ff", "#5e5ce6", "#bf5af2", "#ff2d55"];

function hsv2hex(h, s, v) {
  const f = (n) => {
    const k = (n + h / 60) % 6;
    return v - v * s * Math.max(Math.min(k, 4 - k, 1), 0);
  };
  const hex = (x) => Math.round(x * 255).toString(16).padStart(2, "0");
  return "#" + hex(f(5)) + hex(f(3)) + hex(f(1));
}

function hex2hsv(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = ((n >> 16) & 255) / 255;
  const g = ((n >> 8) & 255) / 255;
  const b = (n & 255) / 255;
  const max = Math.max(r, g, b);
  const d = max - Math.min(r, g, b);
  let h = cp.h;
  if (d) {
    if (max === r) h = ((g - b) / d + 6) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s: max ? d / max : 0, v: max };
}

function paintCP(skipHex) {

  $("cpHueThumb").style.background = "hsl(" + cp.h + ", 100%, 50%)";
  $("cpChip").style.background = hex;
  if (!skipHex) $("cpHex").value = hex;
  setColor(hex);
}

function dragOn(el, fn) {
  el.addEventListener("pointerdown", (event) => {
    el.setPointerCapture(event.pointerId);
    const rect = el.getBoundingClientRect();
    const move = (e) => fn(Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1), Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1));
    const stop = () => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", stop);
      el.removeEventListener("pointercancel", stop);
    };
    move(event);
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", stop);
    el.addEventListener("pointercancel", stop);
  });
}

function openCP() {
  Object.assign(cp, hex2hsv(colorInput.value));
  $("cpBack").hidden = false;
  paintCP();
}

(function () {
  const seg = document.querySelector(".seg");
  const thumb = seg.querySelector(".seg-thumb");
  const BGS = ["transparent", "white", "color"];
  let startX = 0, down = false, dragging = false, pid = null;

  const geom = () => {
    const r = seg.getBoundingClientRect();
    const inner = r.width - 6;
    return { left: r.left + 3, inner, w: inner / 3 };
  };
  const place = (clientX) => {
    const g = geom();
    const x = Math.min(Math.max(clientX - g.left - g.w / 2, 0), g.inner - g.w);
    seg.style.setProperty("--x", x + "px");
    return Math.min(2, Math.max(0, Math.round(x / g.w)));
  };
  const choose = (i) => {
    const wasColor = bg === "color";
    bg = BGS[i];
    applyBackground();
    if (bg === "color" && !wasColor) openCP();
    else if (bg === "color") openCP();
  };

  seg.addEventListener("pointerdown", (e) => {
    if (e.button > 0) return;
    down = true; dragging = false; startX = e.clientX; pid = e.pointerId;
  });
  seg.addEventListener("pointermove", (e) => {
    if (!down || e.pointerId !== pid) return;
    if (!dragging && Math.abs(e.clientX - startX) > 4) {
      dragging = true;
      try { seg.setPointerCapture(pid); } catch (err) {}
      const g = geom();
      seg.style.setProperty("--x", ((Number(getComputedStyle(seg).getPropertyValue("--i")) || 0) * g.w) + "px");
      seg.classList.add("drag");
    }
    if (dragging) place(e.clientX);
  });
  const end = (e, cancel) => {
    if (!down || e.pointerId !== pid) return;
    down = false;
    if (!dragging) return;
    dragging = false;
    const i = place(e.clientX);
    seg.classList.remove("drag");
    try { seg.releasePointerCapture(pid); } catch (err) {}
    if (cancel) { seg.style.removeProperty("--x"); return; }
    seg.style.setProperty("--i", i);
    requestAnimationFrame(() => seg.style.removeProperty("--x"));
    choose(i);
  };
  seg.addEventListener("pointerup", (e) => end(e, false));
  seg.addEventListener("pointercancel", (e) => end(e, true));
})();
$("cpDone").addEventListener("click", closeCP);
$("cpBack").addEventListener("pointerdown", (event) => {
  if (event.target === $("cpBack")) closeCP();
});

document.addEventListener("pointerdown", (event) => {
  document.documentElement.classList.remove("kbd");
  if (!event.target.closest(".dd")) closeDD();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Tab") document.documentElement.classList.add("kbd");
  if (event.key === "Escape") {
    closeDD();
    closeCP();
  }
});
presetSel.addEventListener("change", () => {
  preset = presetSel.value;
  updateRatio();
});
formatSel.addEventListener("change", () => {
  format = formatSel.value;
  updateNote();
});

$("demoSlider").addEventListener("input", (event) => {
  $("demoStage").style.setProperty("--pos", event.target.value + "%");
});

$("retry").addEventListener("click", () => {
  const it = current();
  if (!it) return;
  it.status = "pending";
  it.err = null;
  syncUI(it);
  runQueue();
});
$("download").addEventListener("click", downloadCurrent);
$("downloadAll").addEventListener("click", downloadAll);
$("again").addEventListener("click", reset);
$("lang").addEventListener("click", () => setLang(lang === "en" ? "bn" : "en"));
$("theme").addEventListener("click", () => {
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
});

(function init() {
  let saved = null;
  try { saved = localStorage.getItem("bgr-lang"); } catch {}
  lang = saved === "bn" || saved === "en" ? saved : (navigator.language || "").toLowerCase().startsWith("bn") ? "bn" : "en";
  applyI18n();
  applyBackground();
  updateRatio();
  setTimeout(() => sweepStage($("demoStage"), $("demoSlider")), 500);
})();
</script>
</body>
</html>
